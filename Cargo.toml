[workspace]

members = [
    "discord_client_gateway",
    "discord_client_macros",
    "discord_client_rest",
    "discord_client_structs", "discord_client_utils",

    # Examples
    "examples/feur_bot",
    "examples/invite_join",
    "examples/react_bot",
    "examples/backward_react_bot",
    "examples/event_logger",
    "examples/token_checker",
    "examples/guild_export",
    "examples/dedupe_guilds",
]

resolver = "3"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
wreq = "0.16.1"
wreq-util = { git = "https://github.com/0x676e67/wreq-util.git", rev = "5715529002738f46eea86a7271f918f9374d3582" }
serde_json = "1.0.140"
serde_path_to_error = "0.1.17"
chrono = "0.4.41"
tokio = "1.45.0"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["UwUDev"]
description = "Undetected discord client backend reimplementation"

# wreq-util's chrome 154 profile 
[patch.crates-io]
wreq = { git = "https://github.com/0x676e67/wreq", rev = "cd76bcdf1307153de289d34e072528bdf0510a3b" }
btls = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
